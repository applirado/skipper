    <path d="M470 692 L860 612 L898 604 L898 650 Q700 676 486 712 Z" fill="#0a2a9a"/>
    <!-- Segel -->
    <path d="M636 186 C604 380 560 560 470 692 L860 612 C880 480 800 310 636 186 Z" fill="url(#sail)" filter="url(#sailsh)"/>
    <!-- Rumpf -->
    <path d="M486 712 Q700 676 898 650 Q884 750 826 806 Q650 768 486 712 Z" fill="url(#hull)"/>
    <!-- Welle -->
    <path d="M100 720 C180 640 330 650 460 720 C580 790 680 850 790 840 C850 834 890 810 924 790 L924 1000 L100 1000 Z" fill="url(#deep)"/>
    <path d="M100 720 C180 640 330 650 460 720 C580 790 680 850 790 840 C850 834 890 810 924 790 L924 866 C880 904 800 924 720 914 C600 898 520 842 420 792 C300 738 190 762 100 822 Z" fill="url(#wave)"/>
    <path d="M152 692 C230 652 340 662 450 716" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity=".45"/>
  </g>
</svg>
